sonar.projectKey=Dayron-Glez_openbranch
sonar.organization=dayron-glez010205

# Translated content and per-locale dictionaries are structural mirrors by
# design (identical code blocks, parallel object shapes). Copy-paste
# detection on i18n variants is noise, not a maintainability signal.
#
# Supabase SSR client files follow the official @supabase/ssr integration
# pattern which requires nearly identical cookie-handling boilerplate in
# two different runtime contexts (middleware vs. Server Components) that
# cannot be unified. Flagging them as duplication is noise.
#
# Challenge template files (sandpack-templates/, diffs/, docs-templates/,
# git-templates/) intentionally mirror the source files under content/ which
# are already excluded. diff3.ts is a TypeScript port of the well-known
# node-diff3 algorithm; its high similarity to the original is expected.
# challenge-icons.tsx is a short icon-mapping moved from lib/playground/;
# SonarCloud treats it as new code after the Phase 7a relocation.
sonar.cpd.exclusions=content/**,**/*-dictionary.ts,lib/supabase/**,features/playground/challenges/**/diffs/**,features/playground/challenges/**/*-templates/**,features/playground/challenges/git/diff3.ts,features/playground/domain/challenge-icons.tsx
sonar.coverage.exclusions=**/*

# S6759: "Mark props as read-only" — the project uses TypeScript's structural
# type system and Readonly<> selectively where it adds value. Enforcing it on
# every component prop is noise without a real safety benefit here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
