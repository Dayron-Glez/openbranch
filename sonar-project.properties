# Translated content and per-locale dictionaries are structural mirrors by
# design (identical code blocks, parallel object shapes). Copy-paste
# detection on i18n variants is noise, not a maintainability signal.
#
# Supabase SSR client files follow the official @supabase/ssr integration
# pattern which requires nearly identical cookie-handling boilerplate in
# two different runtime contexts (middleware vs. Server Components) that
# cannot be unified. Flagging them as duplication is noise.
#
# Challenge template files (sandpack-templates/, diffs/, docs-templates/,
# git-templates/) intentionally mirror the source files under content/ which
# are already excluded. diff3.ts is a TypeScript port of the well-known
# node-diff3 algorithm; its high similarity to the original is expected.
# challenge-icons.tsx is a short icon-mapping moved from lib/playground/;
# SonarCloud treats it as new code after the Phase 7a relocation.
#
# testing-fetchupstream.ts — sandpack template file (same family as *-templates/).
# test-runner.worker.ts — web worker bundle; self-contained runtime with no
#   meaningful duplication surface outside its own execution context.
#
# The following three files are moved verbatim from lib/playground/ in Phase 7a
# (feature-first relocation). SonarCloud compares them against their still-present
# counterparts in lib/playground/ (deleted on merge) and flags them as duplicates.
# These exclusions are TEMPORARY and should be removed once Phase 7c cleans up
# lib/playground/ (at which point lib/ no longer has a copy to compare against).
#   features/playground/domain/manifest.ts     ← lib/playground/domain/manifest.ts
#   features/playground/domain/snapshots.ts    ← lib/playground/domain/snapshots.ts
#   features/playground/server/session-service.ts ← lib/playground/session-service.ts
sonar.cpd.exclusions=content/**,**/*-dictionary.ts,lib/supabase/**,features/playground/challenges/**/diffs/**,features/playground/challenges/**/*-templates/**,features/playground/challenges/git/diff3.ts,features/playground/domain/challenge-icons.tsx,features/playground/challenges/testing/testing-fetchupstream.ts,features/playground/challenges/testing/test-runner.worker.ts,features/playground/domain/manifest.ts,features/playground/domain/snapshots.ts,features/playground/server/session-service.ts
sonar.coverage.exclusions=**/*

# S6759: "Mark props as read-only" — the project uses TypeScript's structural
# type system and Readonly<> selectively where it adds value. Enforcing it on
# every component prop is noise without a real safety benefit here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
