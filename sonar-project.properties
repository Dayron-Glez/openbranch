# Translated content and per-locale dictionaries are structural mirrors by
# design (identical code blocks, parallel object shapes). Copy-paste
# detection on i18n variants is noise, not a maintainability signal.
sonar.cpd.exclusions=content/**,lib/landing-dictionary.ts

# S6759: "Mark props as read-only" — the project uses TypeScript's structural
# type system and Readonly<> selectively where it adds value. Enforcing it on
# every component prop is noise without a real safety benefit here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
